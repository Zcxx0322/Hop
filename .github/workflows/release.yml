name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Windows + Linux 并行构建：每个 job 只做「打包 + 上传 artifact」，
# 最后由 release job 统一下载、生成中文说明并发布，避免并发抢着建 Release。
# macOS 产物暂不发布（需要 macOS 机器或自备签名证书），配置保留在 electron-builder.yml 里。
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis zip
          - os: ubuntu-latest
            # AppImage 适合 Arch / 任意发行版，deb 面向 Ubuntu/Debian，pacman 面向 Arch
            target: --linux AppImage deb pacman
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm build

      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.target }} --config electron-builder.yml

      - name: Rename Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $src = Get-ChildItem release -Filter 'Hop-*-x64.zip' | Select-Object -First 1
          if ($src) { Rename-Item $src.FullName "Hop-$ver-portable.zip" }

      - name: List artifacts
        shell: bash
        run: ls -lh release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hop-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.pkg.tar.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -maxdepth 3 -exec cp {} release/ \;
          ls -lh release

      - name: Generate Chinese release notes
        run: node scripts/release-notes.mjs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Hop ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.pkg.tar.*
