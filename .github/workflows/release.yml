name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm build

      - name: Package NSIS installer
        run: pnpm exec electron-builder --win nsis --config electron-builder.yml

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe | Select-Object Name, Length

      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/Hop-$ver-portable.zip" -CompressionLevel Optimal
          Get-ChildItem release -Filter *.zip | Select-Object Name, Length

      - name: Generate Chinese release notes
        run: node scripts/release-notes.mjs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Hop ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            release/Hop-*-x64.exe
            release/Hop-*-portable.zip
